<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Krāsu piedzīvojums</title>

    <style>
        body {
            background: #f1f5f9;
        }

        h1 {
            color: #1e3a8a;
        }

        .noteikumi {
            background: #dbeafe;
            border-radius: 12px;
            padding: 20px;
        }

        button {
            background: #1e3a8a;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h1>Krāsu piedzīvojums</h1>

    <div class="noteikumi">
        <h2>Noteikumi</h2>
        <p>Izlasi noteikumus un nospied sākšanas pogu, lai sāktu spēli!</p>
        <p>Izmanto vadības pogas, lai spēles laikā kontrolētu savu darbību.</p>
    </div>

    <button>Sākt spēli</button>

</body>
</html>
