
<!DOCTYPE html>

        }

<body>

    <div class="skana">

            Šī skaņa atskaņojas, kad spēlētājs

        </p>

        <audio controls src="klikskis.wav"></audio>
    </div>

    <div class="skana">
        <h2>Līmeņa pabeigšana</h2>
